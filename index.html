<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friya Noor — Boutique de voiles &amp; boubous | Maroua</title>
<meta name="description" content="Voiles et boubous traditionnels en tissu léger et respirant, faits à Maroua. Commandez en ligne.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--card:#141414;--gold:#d4af6a;--text:#eadfca;--muted:#a89a7e;--line:#2a2418}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Jost,Helvetica,Arial,sans-serif;font-weight:300;line-height:1.6}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;color:var(--gold);font-weight:600;margin:0}
header{position:sticky;top:0;z-index:5;background:#0b0b0bee;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
header b{font-family:"Cormorant Garamond",Georgia,serif;color:var(--gold);font-size:1.5rem;letter-spacing:.12em}
.btn{background:none;border:1px solid var(--gold);color:var(--gold);padding:10px 22px;letter-spacing:.12em;text-transform:uppercase;font:inherit;font-size:.8rem;cursor:pointer;text-decoration:none;display:inline-block}
.btn.fill{background:var(--gold);color:#0b0b0b}
.hero{text-align:center;padding:40px 20px}
.hero img{width:min(260px,70%);border-radius:8px}
.hero p{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.4rem;margin:6px 0 0}
main{max-width:1000px;margin:0 auto;padding:10px 18px 60px}
.tabs{text-align:center;margin:18px 0}
.tabs .btn{margin:4px;padding:8px 18px}.tabs .on{background:var(--gold);color:#0b0b0b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);padding:16px;text-align:center}
.ph{height:200px;display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--gold);background:#0e0e0e;margin-bottom:12px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:1.4rem}.card small{color:var(--muted)}
.price{color:var(--gold);margin:6px 0 12px}
#ov{display:none;position:fixed;inset:0;background:#000a;z-index:9}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#101010;border-left:1px solid var(--line);z-index:10;transform:translateX(100%);transition:.3s;overflow-y:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
#dr.open{transform:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:10px 0}
.q button{background:none;border:1px solid var(--line);color:var(--gold);width:28px;height:28px;cursor:pointer}
input,textarea,select{width:100%;background:#0b0b0b;border:1px solid var(--line);color:var(--text);padding:10px;margin:6px 0;font:inherit}
.tot{font-size:1.2rem;color:var(--gold);text-align:right;margin:14px 0}
footer{text-align:center;border-top:1px solid var(--line);padding:26px;color:var(--muted);font-size:.85rem;letter-spacing:.1em}
#ok{display:none;text-align:center;padding:30px 0}
</style>
</head>

<footer>FRIYA NOOR · MAROUA · CAMEROUN<br>📲 <a href="https://wa.me/237692225053" style="color:#d4af6a">+237 6 92 22 50 53</a> · @friyanoor</footer>

<div id="ov" onclick="closeCart()"></div>
<aside id="dr">
  <div class="row" style="border:0"><h2>Mon panier</h2><button class="btn" onclick="closeCart()">Fermer</button></div>
  <div id="items"></div>
  
  <form id="f" onsubmit="return order(event)">
    <input name="nom" placeholder="Nom complet" required>
    <input name="tel" type="tel" placeholder="Téléphone / WhatsApp" required>
    <input name="email" type="email" placeholder="Email (facultatif)">
    <input name="ville" placeholder="Ville et quartier" required>
    <textarea name="note" rows="2" placeholder="Adresse, taille, couleur, remarque…"></textarea>
    <select name="pay"><option>Paiement à la livraison</option><option>Orange Money</option><option>MTN Mobile Money</option></select>
    <button class="btn fill" style="width:100%;margin-top:8px" id="sub">Envoyer ma commande</button>
  </form>
  <div id="ok"><h2>Merci ! ✨</h2><p>Votre commande est envoyée. Nous vous contactons très vite.</p></div>
</aside>

<script>
/* ====== À MODIFIER ====== */
const WA = "237692225053";            // WhatsApp de la boutique
const MAIL_KEY = "";                  // clé gratuite Web3Forms (web3forms.com) pour recevoir les commandes par email
const PRODUCTS = [                    // EXEMPLES : remplacer par les vrais modèles et photos
  {id:1, nom:"Voile classique", cat:"Voiles", img:""},
  {id:2, nom:"Voile brodé", cat:"Voiles", img:""},
  {id:3, nom:"Boubou traditionnel", cat:"Boubous", img:""},
  {id:4, nom:"Boubou de cérémonie", cat:"Boubous", img:""}
];
/* ======================== */
const $ = id => document.getElementById(id);
let cart = [], cat = "Tous";
try { cart = JSON.parse(localStorage.getItem("fn_cart")) || []; } catch(e){}
const save = () => { try { localStorage.setItem("fn_cart", JSON.stringify(cart)); } catch(e){} };

function show(){
  const cats = ["Tous", ...new Set(PRODUCTS.map(p=>p.cat))];
  $("tabs").innerHTML = cats.map(c=>`<button class="btn ${c===cat?"on":""}" onclick="cat='${c}';show()">${c}</button>`).join("");
  $("grid").innerHTML = PRODUCTS.filter(p=>cat==="Tous"||p.cat===cat).map(p=>`
    <div class="card"><div class="ph">${p.img?`<img src="${p.img}" alt="${p.nom}">`:"✦"}</div>
    <h3>${p.nom}</h3><small>${p.cat}</small>
    <button class="btn" onclick="add(${p.id})">Ajouter au panier</button></div>`).join("");
}
function add(id){ const l = cart.find(x=>x.id===id); l ? l.q++ : cart.push({id,q:1}); save(); draw(); openCart(); }
function qty(id,d){ const l = cart.find(x=>x.id===id); l.q += d; if(l.q<1) cart = cart.filter(x=>x.id!==id); save(); draw(); }
function draw(){
  $("cnt").textContent = cart.reduce((s,l)=>s+l.q,0);
  $("items").innerHTML = cart.length ? cart.map(l=>{const p=PRODUCTS.find(x=>x.id===l.id);
    return `<div class="row"><div>${p.nom}</div><div class="q"><button onclick="qty(${p.id},-1)">−</button> ${l.q} <button onclick="qty(${p.id},1)">+</button></div></div>`}).join("") : "<p>Votre panier est vide.</p>";
  
  $("f").style.display = cart.length ? "block" : "none";
}
function openCart(){ $("ov").style.display="block"; $("dr").classList.add("open"); }
function closeCart(){ $("ov").style.display="none"; $("dr").classList.remove("open"); }

async function order(e){
  e.preventDefault();
  if(!cart.length) return false;
  const d = Object.fromEntries(new FormData($("f")));
  const lines = cart.map(l=>{const p=PRODUCTS.find(x=>x.id===l.id); return `- ${p.nom} x${l.q}`}).join("\n");
  const msg = `🛍️ NOUVELLE COMMANDE FRIYA NOOR\n\n${lines}\n\nPaiement : ${d.pay}\n\nClient : ${d.nom}\nTél : ${d.tel}\nEmail : ${d.email||"-"}\nVille : ${d.ville}\nNote : ${d.note||"-"}`;
  $("sub").disabled = true; $("sub").textContent = "Envoi…";
  if(MAIL_KEY){
    try { await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({access_key:MAIL_KEY,subject:"Nouvelle commande — "+d.nom,from_name:"Boutique Friya Noor",message:msg,replyto:d.email||undefined})}); } catch(err){}
  }
  cart = []; save(); draw();
  $("f").style.display = "none"; $("ok").style.display = "block";
  window.location.href = `https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
  return false;
}
show(); draw();
</script>
</body>
